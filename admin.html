<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>O-I Academy | Administración</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/admin.css">

</head>

<body>

<div class="admin">

    <aside class="sidebar">

        <div>

            <div class="logo">

                <img src="assets/OI_Academy_transparente.png">

            </div>

            <nav>

                <a class="active" data-page="dashboard">

                    <i class="bi bi-grid-fill"></i>

                    <span>Dashboard</span>

                </a>

                <a data-page="courses">

                    <i class="bi bi-journal-bookmark-fill"></i>

                    <span>Cursos</span>

                </a>

                <a data-page="videos">

                    <i class="bi bi-play-circle-fill"></i>

                    <span>Videos</span>

                </a>

                <a data-page="quizzes">

                    <i class="bi bi-patch-question-fill"></i>

                    <span>Cuestionarios</span>

                </a>

                <a data-page="employees">

                    <i class="bi bi-people-fill"></i>

                    <span>Empleados</span>

                </a>

                <a data-page="reports">

                    <i class="bi bi-bar-chart-fill"></i>

                    <span>Reportes</span>

                </a>

                <a data-page="settings">

                    <i class="bi bi-gear-fill"></i>

                    <span>Configuración</span>

                </a>

            </nav>

        </div>

    </aside>

    <main class="content">

        <div id="app">

        </div>

    </main>

</div>
<!-- MODAL NUEVO CURSO -->

<div class="modal" id="courseModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Nuevo Curso</h2>

            <button id="closeModal">

                <i class="bi bi-x-lg"></i>

            </button>

        </div>

        <div class="modal-body">

            <div class="form-group">

                <label>Nombre del curso</label>

                <input id="courseName" type="text" placeholder="Ej. Seguridad Industrial">

            </div>

            <div class="form-group">

                <label>Categoría</label>

                <select id="courseCategory">

                    <option>Seguridad</option>

                    <option>Producción</option>

                    <option>Calidad</option>

                    <option>Recursos Humanos</option>

                </select>

            </div>

            <div class="form-group">

                <label>Descripción</label>

                <textarea id="courseDescription" rows="4"></textarea>

            </div>

            <div class="form-group">

                <label>Duración</label>

                <input id="courseDuration" type="text" placeholder="2 horas">

            </div>

            <div class="form-buttons">

                <button class="btn-cancel" id="cancelCourse">
            
                    Cancelar
            
                </button>
            
                <button class="btn-save" id="saveCourse">
            
                    <i class="bi bi-plus-circle-fill"></i>
            
                    Crear curso
            
                </button>
            
            </div>

        </div>

    </div>

</div>

<script src="js/admin.js"></script>

</body>

</html>
