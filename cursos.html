<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis Cursos | O-I Academy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/cursos.css">

</head>

<body>

<div class="container">

    <aside class="sidebar">

        <div>

            <div class="logo">

                <img src="assets/OI_Academy_transparente.png" alt="O-I Academy">

            </div>

            <nav>

                <a href="dashboard.html">

                    <i class="bi bi-grid-fill"></i>

                    <span>Inicio</span>

                </a>

                <a class="active">

                    <i class="bi bi-journal-bookmark-fill"></i>

                    <span>Mis cursos</span>

                </a>

                <a>

                    <i class="bi bi-award-fill"></i>

                    <span>Certificados</span>

                </a>

                <a>

                    <i class="bi bi-person-fill"></i>

                    <span>Mi perfil</span>

                </a>

            </nav>

        </div>

        <div class="logout">

            <a href="index.html">

                <i class="bi bi-box-arrow-right"></i>

                <span>Cerrar sesión</span>

            </a>

        </div>

    </aside>

    <main class="content">

        <header class="topbar">

            <div>

                <h1>Mis cursos</h1>

                <p>Todos los cursos asignados.</p>

            </div>

        </header>

        <section class="search-box">

            <input
                type="text"
                placeholder="Buscar un curso...">

        </section>

        <section class="filters">

            <button class="active">Todos</button>

            <button>Pendientes</button>

            <button>En progreso</button>

            <button>Completados</button>

        </section>

        <section class="course-list">

            <div class="course-row">

                <div>

                    <h3>Seguridad Industrial</h3>

                    <p>8 módulos • 12 videos</p>

                </div>

                <div>

                    <span>80%</span>

                </div>

                <a href="curso.html">

                    Continuar

                </a>

            </div>

            <div class="course-row">

                <div>

                    <h3>Calidad</h3>

                    <p>5 módulos • 8 videos</p>

                </div>

                <div>

                    <span>45%</span>

                </div>

                <a href="curso.html">

                    Continuar

                </a>

            </div>

            <div class="course-row">

                <div>

                    <h3>Inducción O-I</h3>

                    <p>10 módulos • Finalizado</p>

                </div>

                <div>

                    <span>100%</span>

                </div>

                <a href="#">

                    Certificado

                </a>

            </div>

        </section>

    </main>

</div>

</body>

</html>
