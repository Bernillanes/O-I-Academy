<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>O-I Academy | Editor de Curso</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/course-editor.css">

</head>

<body>

<div class="admin">

    <aside class="sidebar">

        <div>

            <div class="logo">

                <img src="assets/OI_Academy_transparente.png">

            </div>

            <nav>

                <a href="admin.html" data-page="dashboard">

                    <i class="bi bi-grid-fill"></i>

                    <span>Dashboard</span>

                </a>

                <a href="admin.html" class="active" data-page="courses">

                    <i class="bi bi-journal-bookmark-fill"></i>

                    <span>Cursos</span>

                </a>

                <a href="admin.html" data-page="videos">

                    <i class="bi bi-play-circle-fill"></i>

                    <span>Videos</span>

                </a>

                <a href="admin.html" data-page="quizzes">

                    <i class="bi bi-patch-question-fill"></i>

                    <span>Cuestionarios</span>

                </a>

                <a href="admin.html" data-page="employees">

                    <i class="bi bi-people-fill"></i>

                    <span>Empleados</span>

                </a>

                <a href="admin.html" data-page="reports">

                    <i class="bi bi-bar-chart-fill"></i>

                    <span>Reportes</span>

                </a>

                <a href="admin.html" data-page="settings">

                    <i class="bi bi-gear-fill"></i>

                    <span>Configuración</span>

                </a>

            </nav>

        </div>

    </aside>

    <main class="content">

        <div class="editor-container">

            <header class="editor-header">

                <a href="admin.html" class="back-button">

                    <i class="bi bi-arrow-left"></i>

                    Volver a Cursos

                </a>

                <h1 id="courseTitle">Cargando...</h1>

                <p id="courseSubtitle"></p>

            </header>

            <nav class="editor-tabs">

                <button class="tab active">

                    <i class="bi bi-folder-fill"></i>

                    Módulos

                </button>

                <button class="tab">

                    <i class="bi bi-info-circle-fill"></i>

                    Información

                </button>

                <button class="tab">

                    <i class="bi bi-people-fill"></i>

                    Participantes

                </button>

                <button class="tab">

                    <i class="bi bi-bar-chart-fill"></i>

                    Progreso

                </button>

            </nav>

            <div class="toolbar">

                <button id="newModule" class="btn-primary">

                    <i class="bi bi-plus-circle-fill"></i>

                    Nuevo módulo

                </button>

            </div>

            <div id="modulesContainer">

            </div>

        </div>

    </main>

</div>
<!-- Modal Nuevo Módulo -->
<div id="moduleModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Nuevo módulo</h2>

            <button id="closeModuleModal">

                <i class="bi bi-x-lg"></i>

            </button>

        </div>

        <div class="modal-body">

            <div class="form-group">

                <label>Nombre del módulo</label>

                <input
                    id="moduleName"
                    type="text"
                    placeholder="Ej. Uso de Extintores">

            </div>

            <div class="form-buttons">

                <button class="btn-cancel">

                    Cancelar

                </button>

                <button id="saveModule" class="btn-save">

                    <i class="bi bi-plus-circle-fill"></i>

                    Guardar módulo

                </button>

            </div>

        </div>

    </div>

</div>

<!-- Modal Agregar Contenido -->
<div id="contentModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="contentModalTitle">

                Agregar contenido

            </h2>

            <button id="closeContentModal">

                <i class="bi bi-x-lg"></i>

            </button>

        </div>

        <div class="modal-body">

            <div class="form-group">

                <label>Nombre</label>

                <input
                    id="contentName"
                    type="text"
                    placeholder="Escribe el nombre">

            </div>

            <div class="form-group" id="valueGroup">

                <label id="secondFieldLabel">
            
                    Archivo
            
                </label>
            
                <input
                    id="contentValue"
                    type="file">
            
            </div>
            
            <div class="form-group" id="descriptionGroup">
            
                <label>Descripción</label>
            
                <textarea
                    id="contentDescription"
                    rows="4"
                    placeholder="Escribe una descripción..."></textarea>
            
            </div>

            <div class="form-buttons">

                <button
                    id="cancelContent"
                    class="btn-cancel">

                    Cancelar

                </button>

                <button
                    id="saveContent"
                    class="btn-save">

                    Guardar

                </button>

            </div>

        </div>

    </div>

</div>
<div id="questionModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Administrar preguntas</h2>

            <button id="closeQuestionModal">

                <i class="bi bi-x-lg"></i>

            </button>

        </div>

        <div class="modal-body">

            <div class="question-layout">
        
                <aside class="question-sidebar">

                    <h3>Preguntas</h3>
                
                    <button
                        id="newQuestion"
                        class="btn-save">
                
                        <i class="bi bi-plus-circle-fill"></i>
                
                        Nueva pregunta
                
                    </button>
                
                    <div id="questionsList"></div>
                
                </aside>
        
                <section class="question-editor">
        
                    <div class="form-group">
        
                        <label>Tipo de pregunta</label>
        
                        <select id="questionType">
        
                            <option value="multiple">Opción múltiple</option>
                            <option value="boolean">Verdadero / Falso</option>
                            <option value="text">Respuesta abierta</option>
                            <option value="checkbox">Selección múltiple</option>
                            <option value="order">Ordenar pasos</option>
                            <option value="match">Relacionar columnas</option>
                            <option value="complete">Completar espacios</option>
        
                        </select>
        
                    </div>
        
                    <div id="questionEditor">
        
                    </div>
        
                </section>
        
            </div>
        
        </div>

        <div class="form-buttons">

            <button
                id="cancelQuestion"
                class="btn-cancel">

                Cancelar

            </button>

            <button
                id="saveQuestion"
                class="btn-save">

                Guardar pregunta

            </button>

        </div>

    </div>

</div>
<script src="js/course-editor.js"></script>
</body>

</html>
